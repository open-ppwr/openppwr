blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/open-ppwr/openppwr/security/advisories/new
    about: >-
      Report privately, never as a public issue. See SECURITY.md. Do not include live credentials,
      customer data, uploads, dumps, private keys or private-infrastructure detail.
  - name: Question or discussion
    url: https://github.com/open-ppwr/openppwr/discussions
    about: For usage questions and open-ended discussion, which are not defect reports.
